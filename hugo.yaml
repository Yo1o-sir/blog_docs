baseURL: https://docs.yo1o.top/
locale: zh-CN
title: Yolo's Docs


module:
  imports:
    - path: github.com/imfing/hextra

params:
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  
  navbar:
    displaySearch: true
    displayTitle: true

  comments:
    enable: false
    type: giscus
    giscus:
      repo: Yo1o-sir/comments
      repoID: R_kgDOSHsH3g
      category: Announcements
      categoryID: DIC_kwDOSHsH3s4C7R2K

  imageZoom:
    enable: true

  math:
    enable: true
    library: katex

menu:
  main:
    - name: 刷题
      pageRef: /training
      weight: 1
    - name: study
      pageRef: /study
      weight: 2 
    - name: 大杂烩
      pageRef: /misc
      weight: 3
    - name: shares
      pageRef: /shares
      weight: 4
      # params:
      #   icon: document
    - name: blog主站
      url: https://yo1o.top
      weight: 5
      # params:
      #   icon: emoji-happy
    - name: search
      weight: 6
      params:
        type: search

    - name: github
      url: https://github.com/Yo1o-sir
      weight: 8
      params:
        icon: github

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
    renderer:
      unsafe: true